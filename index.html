<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
body{font-family:Arial,sans-serif}
.bar{position:absolute;left:0;right:0;bottom:5%;height:92px;overflow:hidden;
background:linear-gradient(90deg,rgba(0,0,0,.92),rgba(30,0,35,.88),rgba(0,0,0,.92));
border-top:3px solid #ff2d78;border-bottom:3px solid #7b5cff;
box-shadow:0 0 18px #ff2d78, inset 0 0 18px rgba(123,92,255,.35)}
.track{display:flex;width:max-content;height:100%;align-items:center;animation:move 24s linear infinite}
.msg{font-size:42px;font-weight:900;color:#fff;text-shadow:0 0 5px #000,0 0 12px #ff2d78;
padding:0 70px;white-space:nowrap}
.msg b{color:#ffd21c}
@keyframes move{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}
</style>
</head>
<body>
<div class="bar"><div class="track">
<span class="msg">✨ Butuh Jasa <b>Edit Foto</b> Silahkan DM Terimakasih ✨</span>
<span class="msg">✨ Butuh Jasa <b>Edit Foto</b> Silahkan DM Terimakasih ✨</span>
</div></div>
</body>
</html>
